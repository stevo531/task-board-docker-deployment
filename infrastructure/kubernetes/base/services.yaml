# ==========================================
# 1. API GATEWAY
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: taskboard
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: task-board/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
            - name: TASK_SERVICE_URL
              value: "http://task-service:8081"
            - name: TEAM_SERVICE_URL
              value: "http://team-service:8082"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8083"
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

---
# ==========================================
# 2. TASK SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: taskboard
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: task-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: task-board/task-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "taskuser"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "Manirampa20@"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_USERNAME
              value: "taskuser"
            - name: RABBITMQ_PASSWORD
              value: "Manirampa20@"
            - name: TEAM_SERVICE_URL
              value: "http://team-service:8082"
          startupProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

