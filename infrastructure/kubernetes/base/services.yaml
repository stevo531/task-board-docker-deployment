# ==========================================
# 1. API GATEWAY
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: taskboard
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: task-board/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TASK_SERVICE_URL
              value: "http://task-service:8081"
            - name: TEAM_SERVICE_URL
              value: "http://team-service:8082"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8083"
          resources:
            requests:
              memory: "180Mi"
              cpu: "150m"
            limits:
              memory: "300Mi"
              cpu: "500m"

---
# ==========================================
# 2. TASK SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: taskboard
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: task-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: task-board/task-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/taskdb"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_PASSWORD
            - name: RABBITMQ_HOST
              value: "rabbitmq"
          resources:
            requests:
              memory: "180Mi"
              cpu: "150m"
            limits:
              memory: "300Mi"
              cpu: "500m"

---
