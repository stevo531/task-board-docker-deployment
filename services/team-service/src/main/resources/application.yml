server:
  port: 8082

spring:
  application:
    name: team-service
  datasource:
    url: jdbc:mysql://localhost:3306/teamdb
    username: ${TEAM_DB_USER:root}
    password: ${TEAM_DB_PASS:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
