server:
  port: 8082

spring:
  application:
    name: team-service
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/teamdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
